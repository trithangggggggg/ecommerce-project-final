# =============================================================================
#  nginx/default.conf - Reverse Proxy & Static File Gateway
# -----------------------------------------------------------------------------
#  - Phục vụ ứng dụng ReactJS Frontend (SPA routing)
#  - Chuyển tiếp toàn bộ request /api/ -> service Spring Boot "app" cổng 8080
# =============================================================================

upstream spring_app {
    server app:8080;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Phục vụ giao diện Frontend ReactJS (hỗ trợ HTML5 History API routing)
    location / {
        root      /usr/share/nginx/html;
        index     index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp toàn bộ API tới backend Spring Boot
    location /api/ {
        proxy_pass         http://spring_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
