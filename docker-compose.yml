# =============================================================================
#  docker-compose.yml - E-Commerce System Deployment
#  - Services:
#      + mysql: Cơ sở dữ liệu MySQL 8.0, tự động khởi tạo bằng database/init.sql
#      + app: Backend Spring Boot 4 (Java 21), kết nối mysql qua db-net
#      + nginx: Frontend ReactJS (Vite) + Reverse Proxy gateway cho /api/
#  - Mạng:
#      + proxy-net (nginx <-> app)
#      + db-net (app <-> mysql; MySQL không mở cổng ra ngoài để bảo mật)
#  - Khởi động: docker compose --env-file student.env up -d --build
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-ecommerce-final}

services:
  # ---------------------------------------------------------------- MySQL Service
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Ecommerce@2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - db-net

  # ---------------------------------------------------------------- Spring Boot Backend
  app:
    build:
      context: ./server
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${APP_IMAGE:-ecommerce-app}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      DB_USER: ${MYSQL_USER:-ecommerce_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-Ecommerce@2026}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db-net
      - proxy-net

  # ---------------------------------------------------------------- Nginx & Frontend
  nginx:
    build:
      context: ./client
    image: ${FRONTEND_IMAGE:-ecommerce-frontend}:${APP_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - proxy-net

networks:
  proxy-net:
  db-net:

volumes:
  mysql_data:
