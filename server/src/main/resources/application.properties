spring.application.name=server
server.port=${SERVER_PORT:8080}

# MySQL DataSource Configuration (Hỗ trợ cả chạy Local và Docker)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Thời hạn Access Token: 7 ngày = 604800000 ms)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Spring Mail (Gmail SMTP) Configuration - Gửi mã OTP xác thực email trực tiếp từ Spring Boot
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:trithang2006vn@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SePay Payment & VietQR Direct Configuration
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.bank-name=${SEPAY_BANK_NAME:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:DH}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
sepay.qr-template=${SEPAY_QR_TEMPLATE:qronly}
sepay.qr-timeout-minutes=${SEPAY_QR_TIMEOUT_MINUTES:15}
sepay.merchant-id=${SEPAY_MERCHANT_ID:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.ipn-secret-key=${SEPAY_IPN_SECRET_KEY:}
sepay.checkout-url=${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
sepay.api-url=${SEPAY_API_URL:https://pgapi-sandbox.sepay.vn}
sepay.success-url=${SEPAY_SUCCESS_URL:http://localhost:5173/payment/result}
sepay.error-url=${SEPAY_ERROR_URL:http://localhost:5173/payment/result}
sepay.cancel-url=${SEPAY_CANCEL_URL:http://localhost:5173/payment/result}
